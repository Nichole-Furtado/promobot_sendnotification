name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend (Maven + Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: promobot_test
          POSTGRES_USER: promobot
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build & test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/promobot_test
          SPRING_DATASOURCE_USERNAME: promobot
          SPRING_DATASOURCE_PASSWORD: testpassword
          TELEGRAM_BOT_TOKEN: dummy_token_for_ci
          TELEGRAM_CHAT_ID: "0"
          GEMINI_API_KEY: dummy_key_for_ci
          GROQ_API_KEY: dummy_key_for_ci
          AMAZON_ASSOCIATE_TAG: dummy-tag-20
        run: mvn -B verify --no-transfer-progress

      - name: Upload JAR artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: promobot-jar
          path: target/promobot-*.jar
          retention-days: 7

  frontend:
    name: Frontend (Node + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: promobot-frontend-dist
          path: frontend/dist/
          retention-days: 7
