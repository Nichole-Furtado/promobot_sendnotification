server.port=8080

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway - schema ja existe no banco, desabilitado
spring.flyway.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.promobot=INFO

# Timezone (Brasil/Sao_Paulo) - aplicado tambem no Jackson para serializar datas em BRT
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Telegram
promobot.telegram.bot-token=${TELEGRAM_BOT_TOKEN}
promobot.telegram.chat-id=${TELEGRAM_CHAT_ID}

# Gemini
promobot.gemini.api-key=${GEMINI_API_KEY}
promobot.gemini.model=gemini-1.5-flash

# Groq (backup AI)
promobot.groq.api-key=${GROQ_API_KEY}

# Amazon
promobot.amazon.associate-tag=${AMAZON_ASSOCIATE_TAG}

# Scheduler de deteccao de promocao real - roda a cada 30 minutos
promobot.scheduler.cron=0 0/30 * * * ?
promobot.scheduler.enabled=true

# Scheduler de divulgacao rotativa - envia 1 produto a cada 15 minutos
# para o Telegram (rotaciona pelo lastNotifiedAt mais antigo).
promobot.broadcaster.cron=0 0/15 * * * ?
promobot.broadcaster.enabled=true
